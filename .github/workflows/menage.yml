name: Ménage quotidien du site
on:
  schedule:
    - cron: "15 8 * * *"   # chaque jour vers 4 h 15 (heure du Québec)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "Rabais Flash QC"
          git config user.email "rabaisflashqc-ca@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Ménage automatique des deals" && git push)
