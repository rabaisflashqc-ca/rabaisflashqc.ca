name: Mise à jour des deals
# Heures du Québec (été comme hiver), gérées par horaire.py :
#   tous les jours 6 h 30, 11 h 30, 19 h 30 · fin de semaine 8 h 30
#   Vendredi fou (20 nov. au 2 déc.) et Boxing Day (24 au 28 déc.) : aussi 9 h 30, 15 h 30, 21 h 30
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 1 * * *"
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"
    - cron: "30 12 * * 0,6"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "30 19 * * *"
    - cron: "30 2 * * *"
    - cron: "30 20 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deals
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Est-ce une heure prévue?
        id: h
        run: python3 horaire.py
      - name: Chercher les deals sur Amazon
        if: steps.h.outputs.go == '1'
        env:
          AMZ_CLIENT_ID: ${{ secrets.AMZ_CLIENT_ID }}
          AMZ_CLIENT_SECRET: ${{ secrets.AMZ_CLIENT_SECRET }}
        run: python3 fetch_deals.py 2>&1 | tee api_status.txt
      - if: steps.h.outputs.go == '1'
        run: python3 build.py
      - name: Préparer le pack de publication du jour
        if: steps.h.outputs.go == '1'
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg || true
          python3 pack.py "${{ steps.h.outputs.slot }}"
      - name: Publier si quelque chose a changé
        if: steps.h.outputs.go == '1'
        run: |
          git config user.name "Rabais Flash QC"
          git config user.email "rabaisflashqc-ca@users.noreply.github.com"
          git add data.json docs api_status.txt
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des deals" && git push)
