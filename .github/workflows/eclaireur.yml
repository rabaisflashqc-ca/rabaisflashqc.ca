name: Éclaireur RedFlagDeals
# Vers 6 h, 12 h et 18 h (heure du Québec) : liste des deals Amazon.ca les plus votés sur RFD, à valider par Alex.
on:
  schedule:
    - cron: "23 9 * * *"   # matin (5 h 23 HAE / 4 h 23 HNE)
    - cron: "47 10 * * *"  # secours du matin si GitHub a sauté le premier
    - cron: "17 16 * * *"
    - cron: "13 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deals
  cancel-in-progress: false
jobs:
  eclaireur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 eclaireur.py
      - run: python3 build.py
      - name: Publier la liste
        run: |
          git config user.name "Rabais Flash QC"
          git config user.email "rabaisflashqc-ca@users.noreply.github.com"
          git add docs rfd.json rfd_debug.html top_state.json suivi
          git diff --cached --quiet || (git commit -m "Éclaireur du matin" && git pull --rebase && git push)
