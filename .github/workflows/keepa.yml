name: Scan Keepa (deals du jour et prix)
# Toutes les heures de 6 h à 23 h (heure du Québec). Ne fait rien tant que le secret KEEPA_KEY n'existe pas.
on:
  schedule:
    - cron: "20 11-23,0-4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deals
  cancel-in-progress: false
jobs:
  keepa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Keepa
        env:
          KEEPA_KEY: ${{ secrets.KEEPA_KEY }}
        run: python3 keepa.py
      - run: python3 build.py
      - name: Publier
        run: |
          git config user.name "Rabais Flash QC"
          git config user.email "rabaisflashqc-ca@users.noreply.github.com"
          git add docs suivi top_state.json
          git diff --cached --quiet || (git commit -m "Scan Keepa : deals et prix du jour" && git pull --rebase && git push)
